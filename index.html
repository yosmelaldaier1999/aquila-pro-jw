<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Aquila Pro JW FULL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body { font-family: Arial; background:#eef2f7; text-align:center; }
.container { max-width:1000px; margin:auto; padding:20px; }
button { padding:10px; margin:5px; background:#2c3e50; color:white; border:none; border-radius:5px; }
table { width:100%; margin-top:20px; border-collapse:collapse; }
td, th { border:1px solid #ccc; padding:8px; }
th { background:#2c3e50; color:white; }
input, select { padding:5px; }
</style>
</head>

<body>
<div class="container">

<h2>🟦 Aquila Pro JW FULL</h2>

<input type="file" id="excelFile">
<br>
<button onclick="cargarExcel()">Cargar Excel</button>
<button onclick="generarPrograma()">Generar Programa Completo</button>

<h3>👥 Participantes</h3>
<table id="tablaParticipantes">
<thead>
<tr>
<th>Nombre</th>
<th>Género</th>
<th>Rol</th>
</tr>
</thead>
<tbody></tbody>
</table>

<h3>📅 Programa</h3>
<table id="tablaPrograma">
<thead>
<tr>
<th>Parte</th>
<th>Asignados</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>

let participantes = [];
let historialParejas = JSON.parse(localStorage.getItem("parejas") || "{}");

function detectarGenero(nombre){
  return nombre.endsWith("a") ? "F" : "M";
}

function cargarExcel(){
  const file = document.getElementById("excelFile").files[0];
  const reader = new FileReader();

  reader.onload = function(e){
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, {type:'array'});

    const sheet = workbook.Sheets["Hermanos"];
    const json = XLSX.utils.sheet_to_json(sheet);

    participantes = json.map((row,i)=>{
      let nombre = row["Nombre Completo"] || Object.values(row)[0];
      return {
        id:i,
        nombre:nombre,
        genero: detectarGenero(nombre),
        rol:"publicador",
        ultima:0
      }
    });

    renderParticipantes();
  };

  reader.readAsArrayBuffer(file);
}

function renderParticipantes(){
  let tbody = document.querySelector("#tablaParticipantes tbody");
  tbody.innerHTML = "";

  participantes.forEach(p=>{
    let tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${p.nombre}</td>
      <td>
        <select onchange="p.genero=this.value">
          <option ${p.genero=="M"?"selected":""}>M</option>
          <option ${p.genero=="F"?"selected":""}>F</option>
        </select>
      </td>
      <td>
        <select onchange="p.rol=this.value">
          <option>publicador</option>
          <option>no bautizado</option>
          <option>ministerial</option>
          <option>anciano</option>
        </select>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function elegir(usados, filtro){
  let lista = participantes.filter(p=>!usados.includes(p.id));
  if(filtro) lista = lista.filter(filtro);
  lista.sort((a,b)=>a.ultima-b.ultima);
  return lista[0];
}

function pareja(usados, genero){
  let lista = participantes.filter(p=>!usados.includes(p.id) && p.genero==genero);

  let mejor=null, menor=999;

  for(let i=0;i<lista.length;i++){
    for(let j=i+1;j<lista.length;j++){
      let key=lista[i].id+"-"+lista[j].id;
      let uso=historialParejas[key]?.veces||0;

      if(uso<menor){
        menor=uso;
        mejor=[lista[i],lista[j]];
      }
    }
  }

  if(mejor){
    let key=mejor[0].id+"-"+mejor[1].id;
    if(!historialParejas[key]) historialParejas[key]={veces:0};
    historialParejas[key].veces++;
  }

  return mejor;
}

function generarPrograma(){
  let usados=[];
  let programa=[];

  function asignar(parte, p){
    usados.push(...p.map(x=>x.id));
    p.forEach(x=>x.ultima=Date.now());
    programa.push({parte, nombres:p.map(x=>x.nombre)});
  }

  asignar("Oración inicial",[elegir(usados,p=>p.genero=="M")]);
  asignar("Lectura bíblica",[elegir(usados,p=>p.genero=="M")]);

  asignar("Primera conversación", pareja(usados,"M"));
  asignar("Revisita", pareja(usados,"F"));
  asignar("Curso bíblico", pareja(usados,"M"));

  asignar("Vida cristiana",[elegir(usados)]);
  asignar("Estudio congregación",[elegir(usados,p=>p.rol!="no bautizado")]);
  asignar("Oración final",[elegir(usados,p=>p.genero=="M")]);

  localStorage.setItem("parejas", JSON.stringify(historialParejas));

  renderPrograma(programa);
}

function renderPrograma(programa){
  let tbody = document.querySelector("#tablaPrograma tbody");
  tbody.innerHTML="";

  programa.forEach(p=>{
    let tr=document.createElement("tr");
    tr.innerHTML=`<td>${p.parte}</td><td>${p.nombres.join(" + ")}</td>`;
    tbody.appendChild(tr);
  });
}

</script>

</body>
</html>
