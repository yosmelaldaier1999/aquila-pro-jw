<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Aquila Pro JW</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body { font-family: Arial; background:#f4f6f9; text-align:center; }
.container { max-width:900px; margin:auto; padding:20px; }
button { padding:10px 20px; margin:10px; border:none; background:#2c3e50; color:white; border-radius:5px; }
table { width:100%; margin-top:20px; border-collapse:collapse; }
td, th { border:1px solid #ddd; padding:10px; }
th { background:#2c3e50; color:white; }
</style>
</head>

<body>
<div class="container">
<h1>🟦 Aquila Pro JW</h1>

<input type="file" id="excelFile">
<br>
<button onclick="cargarExcel()">Cargar Excel</button>
<button onclick="generarSemana()">Generar Semana</button>

<table id="tabla">
<thead>
<tr>
<th>Parte</th>
<th>Asignados</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<script>
let participantes = [];
let historialParejas = {};
let historialAsignaciones = {};

function cargarExcel() {
  const file = document.getElementById("excelFile").files[0];
  const reader = new FileReader();

  reader.onload = function(e) {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, {type: 'array'});

    const sheet = workbook.Sheets["Hermanos"];
    const json = XLSX.utils.sheet_to_json(sheet);

    participantes = json.map((row, i) => ({
      id: i,
      nombre: row["Nombre Completo"] || Object.values(row)[0],
      ultimaAsignacion: 0
    }));

    alert("Participantes cargados: " + participantes.length);
  };

  reader.readAsArrayBuffer(file);
}

function elegirParticipante(usados) {
  let disponibles = participantes.filter(p => !usados.includes(p.id));
  disponibles.sort((a,b)=>a.ultimaAsignacion-b.ultimaAsignacion);
  return disponibles[0];
}

function crearPareja(usados) {
  let disponibles = participantes.filter(p => !usados.includes(p.id));

  let mejor = null;
  let menorUso = Infinity;

  for (let i=0;i<disponibles.length;i++){
    for (let j=i+1;j<disponibles.length;j++){
      let p1 = disponibles[i];
      let p2 = disponibles[j];

      let key = p1.id+"-"+p2.id;
      let uso = historialParejas[key]?.veces || 0;

      if (uso < menorUso){
        menorUso = uso;
        mejor = [p1,p2];
      }
    }
  }

  return mejor;
}

function registrarPareja(p1,p2){
  let key = p1.id+"-"+p2.id;
  if(!historialParejas[key]) historialParejas[key]={veces:0};
  historialParejas[key].veces++;
}

function generarSemana() {
  let usados = [];
  let programa = [];

  // Lectura
  let lectura = elegirParticipante(usados);
  usados.push(lectura.id);
  lectura.ultimaAsignacion = Date.now();

  programa.push({parte:"Lectura", nombres:[lectura.nombre]});

  // Demostración
  let pareja = crearPareja(usados);
  usados.push(pareja[0].id, pareja[1].id);

  pareja[0].ultimaAsignacion = Date.now();
  pareja[1].ultimaAsignacion = Date.now();

  registrarPareja(pareja[0], pareja[1]);

  programa.push({
    parte:"Demostración",
    nombres:[pareja[0].nombre, pareja[1].nombre]
  });

  mostrarTabla(programa);
}

function mostrarTabla(programa){
  let tbody = document.querySelector("#tabla tbody");
  tbody.innerHTML = "";

  programa.forEach(p=>{
    let tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${p.parte}</td>
      <td>${p.nombres.join(" + ")}</td>
    `;
    tbody.appendChild(tr);
  });
}
</script>

</body>
</html>
